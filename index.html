  <title>Trivex Holding | Trade Smart. Grow Wealth.</title>

  <!-- ── Google Translate – suppress default toolbar ── -->
  <style>
    /* Hide Google's injected top bar */
    .goog-te-banner-frame.skiptranslate {
      display: none !important;
    }

    body {
      top: 0 !important;
    }

    /* Hide the "Translated by Google" popup badge */
    .goog-te-gadget-icon,
    .goog-logo-link,
    .goog-te-gadget span,
    #goog-gt-tt,
    .goog-te-balloon-frame {
      display: none !important;
    }

    /* Keep the hidden select wrapper invisible */
    #google_translate_element {
      display: none !important;
    }

    /* Smooth font rendering after translation */
    .translated-ltr,
    .translated-rtl {
      font-family: inherit !important;
    }
  </style>

  <!-- Smartsupp Live Chat script -->
  <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '2156746f4b151eabc44356c6b14aa1279a2a6b98';
    window.smartsupp || (function (d) {
      var s, c, o = smartsupp = function () { o._.push(arguments) }; o._ = [];
      s = d.getElementsByTagName('script')[0]; c = d.createElement('script');
      c.type = 'text/javascript'; c.charset = 'utf-8'; c.async = true;
      c.src = 'https://www.smartsuppchat.com/loader.js?'; s.parentNode.insertBefore(c, s);
    })(document);
  </script>



</head>

<body>
  <!-- Hidden Google Translate mount point -->
  <div id="google_translate_element"></div>

  <div id="root"></div>

  <!-- ── Google Translate widget init ── -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',
          autoDisplay: false,
          gaTrack: false,
        },
        'google_translate_element'
      );
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async
    defer>
    </script>
